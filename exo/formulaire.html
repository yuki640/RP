<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
</head>
<body>
    

    <script>
 class Personne {
  constructor(nom, age) {
    this.nom = nom; // Attribut nom
    this.age = age; // Attribut age
  }

  // Méthode sePresenter
  sePresenter() {
    console.log(`Bonjour, je m'appelle ${this.nom} et j'ai ${this.age} ans.`);
  }
}
 
class Etudiant extends Personne {
  constructor(nom, age, formation) {
    super(nom, age); // Appelle le constructeur de la classe parent (Personne)
    this.formation = formation; // Attribut spécifique à Etudiant
  }

  // Méthode maFormation
  maFormation() {
    console.log(`Je suis actuellement une formation de ${this.formation}.`);
  }
}

// Créer un objet Personne
const personne = new Personne("Alice", 30);
personne.sePresenter(); // Affiche : Bonjour, je m'appelle Alice et j'ai 30 ans.

// Créer un objet Etudiant
const etudiant = new Etudiant("Bob", 20, "Développement Web");
etudiant.sePresenter(); // Affiche : Bonjour, je m'appelle Bob et j'ai 20 ans.
etudiant.maFormation(); // Affiche : Je suis actuellement une formation de Développement Web.



// Affiche : nom et age de la personne
console.log(etudiant.nom); // Affiche : Bob

console.log(personne.nom);

    </script>

    
</body>
</html>
